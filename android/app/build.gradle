plugins { id 'com.android.application' }

android {
    namespace 'studio.koma.app'
    compileSdk 33
    defaultConfig {
        applicationId 'studio.koma.app'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets { main { assets.srcDirs = ['../../dist'] } }
    signingConfigs {
        if (System.getenv('KOMA_KEYSTORE')) {
            release {
                storeFile file(System.getenv('KOMA_KEYSTORE'))
                storePassword System.getenv('KOMA_STORE_PASSWORD')
                keyAlias System.getenv('KOMA_KEY_ALIAS') ?: 'komastudio'
                keyPassword System.getenv('KOMA_KEY_PASSWORD') ?: System.getenv('KOMA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KOMA_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

tasks.named('preBuild').configure {
    doFirst {
        if (!file('../../dist/index.html').exists()) throw new GradleException('Run npm ci && npm run build in the repository root first.')
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.activity:activity:1.7.2'
}
